name: Deploy Vektor Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connecting to VPS and updating app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/marketplace-api
            git pull origin main
            docker stop my_backend || true
            docker rm my_backend || true
            docker build -t platform-backend .
            docker run -d -p 80:8000 --name my_backend platform-backend
            docker system prune -f
