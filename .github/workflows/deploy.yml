name: Deploy Vektor Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connecting to VPS and updating app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/marketplace-api
            git fetch origin main
            git reset --hard origin/main
            docker stop my_backend || true
            docker rm my_backend || true
            docker build -t platform-backend .
            docker run -d -p 127.0.0.1:8000:8000 -v marketplace_media:/app/media --env-file .env --name my_backend platform-backend
            if docker exec my_backend python manage.py shell -c "from django.db import connection; raise SystemExit(0 if any(column.name == 'author_id' for column in connection.introspection.get_table_description(connection.cursor(), 'ads_ad')) else 1)"; then
              docker exec my_backend python manage.py migrate ads 0002 --fake
            fi
            if docker exec my_backend python manage.py shell -c "from django.db import connection; raise SystemExit(0 if any(column.name == 'master_id' for column in connection.introspection.get_table_description(connection.cursor(), 'responses_response')) else 1)"; then
              docker exec my_backend python manage.py migrate responses 0002 --fake
            fi
            docker exec my_backend python manage.py migrate
            docker system prune -f
